{# Staff delete-confirmation modal (Burmese). Edit now lives in order_form.html. #}

<div id="deleteConfirmationModal" class="fixed inset-0 z-50 hidden bg-stone-900/40 backdrop-blur-sm items-center justify-center p-4 transition-all duration-200">
    <div class="bg-white max-w-md w-full rounded border border-stone-200 shadow-xl overflow-hidden p-6 space-y-6 transform scale-95 transition-transform duration-200" id="modalCard">
        <div class="flex items-start gap-4">
            <div class="bg-rose-50 p-2 rounded-full text-rose-600 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <div class="space-y-1">
                <h3 class="text-base font-semibold text-stone-900 font-sans">အော်ဒါ မှတ်တမ်း ဖျက်ရန် သေချာပါသလား?</h3>
                <h4 class="text-xs font-bold tracking-wider text-stone-400 font-sans uppercase">အတည်ပြု ဖျက်ရန်</h4>
            </div>
        </div>

        <div class="bg-stone-50 border border-stone-200/60 rounded p-3.5 text-xs text-stone-600 space-y-1 font-sans">
            <p>ဤဖောက်သည်၏ အော်ဒါ မှတ်တမ်းကို အပြီးတိုင် ဖျက်ရန် ဖြစ်ပါသည်။ ဤလုပ်ဆောင်ချက်ကို နောက်ပြန်လှည့်၍ မရပါ။</p>
            <div class="pt-2 mt-2 border-t border-stone-200/60 font-numeric text-stone-800 flex justify-between">
                <span>ပစ်မှတ်: <strong id="modalCustomerName" class="font-semibold text-stone-950"></strong></span>
                <span id="modalOrderDate" class="text-stone-400"></span>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row justify-end items-center gap-3 pt-2">
            <button type="button" onclick="closeDeleteModal()" class="w-full sm:w-auto bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-semibold tracking-wider uppercase py-2.5 px-5 rounded transition-all font-sans order-2 sm:order-1 cursor-pointer">ပယ်ဖျက်</button>
            <a id="modalDeleteConfirmBtn" href="#" class="w-full sm:w-auto text-center bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold tracking-wider uppercase py-2.5 px-6 rounded transition-all shadow-xs font-sans order-1 sm:order-2 cursor-pointer">အတည်ပြု ဖျက်မည်</a>
        </div>
    </div>
</div>

<script>
    const modalOverlay = document.getElementById('deleteConfirmationModal');
    const mCard = document.getElementById('modalCard');
    const mCust = document.getElementById('modalCustomerName');
    const mDate = document.getElementById('modalOrderDate');
    const mBtn = document.getElementById('modalDeleteConfirmBtn');

    function openDeleteModal(orderId, customerName, orderDate) {
        mCust.textContent = customerName;
        mDate.textContent = orderDate;
        mBtn.setAttribute('href', `/delete_order/${orderId}`);
        modalOverlay.classList.remove('hidden');
        modalOverlay.classList.add('flex');
        setTimeout(() => { mCard.classList.remove('scale-95'); mCard.classList.add('scale-100'); }, 10);
    }

    function closeDeleteModal() {
        mCard.classList.remove('scale-100');
        mCard.classList.add('scale-95');
        setTimeout(() => { modalOverlay.classList.remove('flex'); modalOverlay.classList.add('hidden'); }, 150);
    }

    mBtn.addEventListener('click', function() {
        try { sessionStorage.setItem('mc_restore_scroll_y', String(window.scrollY)); } catch (e) {}
    });

    window.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeDeleteModal();
    });
</script>
